; SWD upload via OpenOCD. If you see "OpenOCD init failed", slow the clock (debug_speed) and check SWDIO/SWCLK/GND + target power.
[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_unflags =
    -DPICO_STDIO_UART
    -DPICO_STDIO_USB
build_src_flags =
    -O0
    -DPICO_STDIO_USB=0
    -DPICO_STDIO_UART=0
    -I${PROJECT_DIR}/../shared
    -DHC12_UART1_TX_PIN=4
    -DHC12_UART1_RX_PIN=5
    ; STEP B / rewiring: listen on UART0 @ 0/1 and UART1 @ 4/5 (default from shared/hc12_uart.h).
    ; If HC-12 is wired ONLY to 4/5 and you see random STOPs, add: -DHC12_CAR_RX_ENABLE_UART0=0
    ; Stronger motion (percent duty); tune down if drivers or battery sag.
    -DDRIVE_SPEED=75
    -DTURN_SPEED=62
debug_tool = picoprobe
upload_protocol = picoprobe
; SWD clock in kHz (default in platform was 5000). Long wires / noisy target: try 500–1000 first.
debug_speed = 500
monitor_speed = 115200
; Do not force RTS/DTR off — can break Pico USB CDC on macOS.
; Do not hardcode monitor_port — device names change after replug (e.g. usbmodem103).
; Use: pio device list   then   pio device monitor -p <that_port> -b 115200

; USB debug: RX lines + heartbeat + longer fail-safe (use while diagnosing HC-12 / no movement).
[env:proton_radio_debug]
extends = env:proton
build_unflags =
    -DPICO_STDIO_UART
    -DPICO_STDIO_USB
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
    -I${PROJECT_DIR}/../shared
    -DHC12_UART1_TX_PIN=4
    -DHC12_UART1_RX_PIN=5
    -DDRIVE_SPEED=75
    -DTURN_SPEED=62
    -DCAR_UART_DEBUG_LOG=1
    -DCOMMAND_TIMEOUT_MS=800

; Self-test without radio: validates motor wiring and direction only.
[env:proton_motor_wiring_test]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=0
    -DPICO_STDIO_UART=0
    -I${PROJECT_DIR}/../shared
    -DHC12_UART1_TX_PIN=4
    -DHC12_UART1_RX_PIN=5
    -DMOTOR_WIRING_TEST_MODE=1
    -DCAR_UART_DEBUG_LOG=0

; Self-test without radio: drives forward continuously.
[env:proton_motor_forward_test]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=0
    -DPICO_STDIO_UART=0
    -I${PROJECT_DIR}/../shared
    -DHC12_UART1_TX_PIN=4
    -DHC12_UART1_RX_PIN=5
    -DMOTOR_ONLY_TEST_MODE=1
    -DCAR_UART_DEBUG_LOG=0

; Same as proton but explicit CMSIS-DAP (Raspberry Pi Debug Probe). Try if "picoprobe" upload misbehaves.
[env:proton_cmsis]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_unflags =
    -DPICO_STDIO_UART
    -DPICO_STDIO_USB
build_src_flags =
    -O0
    -DPICO_STDIO_USB=0
    -DPICO_STDIO_UART=0
    -I${PROJECT_DIR}/../shared
    -DHC12_UART1_TX_PIN=4
    -DHC12_UART1_RX_PIN=5
    -DDRIVE_SPEED=75
    -DTURN_SPEED=62
debug_tool = cmsis-dap
upload_protocol = cmsis-dap
debug_speed = 500
monitor_speed = 115200
