; SWD upload via OpenOCD. If you see "OpenOCD init failed", slow the clock (debug_speed) and check SWDIO/SWCLK/GND + target power.
[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags = -O0
debug_tool = picoprobe
upload_protocol = picoprobe
; SWD clock in kHz (default in platform was 5000). Long wires / noisy target: try 500–1000 first.
debug_speed = 500
monitor_speed = 115200

; Same as proton but explicit CMSIS-DAP (Raspberry Pi Debug Probe). Try if "picoprobe" upload misbehaves.
[env:proton_cmsis]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags = -O0
debug_tool = cmsis-dap
upload_protocol = cmsis-dap
debug_speed = 500
monitor_speed = 115200
