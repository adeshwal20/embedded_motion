; HC-12 uses uart0 @ 0/1 and uart1 @ 20/21 at 9600 — do not use those UARTs for stdio.
; Debug prints go over USB CDC when the Proton USB is plugged into the PC.
[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
debug_tool = picoprobe
upload_protocol = picoprobe
debug_speed = 500
monitor_speed = 115200

; HC-12 bring-up: pick one env and Upload — no need to edit main.c.
;   proton_hc12_fwd   → constant FORWARD
;   proton_hc12_left  → constant LEFT
;   proton_hc12_seq   → ~2s FORWARD then ~2s LEFT (repeat)
;   proton_hc12_fb    → alternate FORWARD / BACKWARD
;   proton_hc12_wheels → FORWARD→LEFT→RIGHT→BACK (~2s each, repeat) — bench-style wheel check via radio
[env:proton_hc12_fwd]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
    -DGLOVE_HC12_TEST_MODE=1

[env:proton_hc12_left]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
    -DGLOVE_HC12_TEST_MODE=2

[env:proton_hc12_seq]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
    -DGLOVE_HC12_TEST_MODE=3

[env:proton_hc12_fb]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
    -DGLOVE_HC12_TEST_MODE=4

[env:proton_hc12_wheels]
extends = env:proton
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
    -DGLOVE_HC12_TEST_MODE=5

[env:proton_cmsis]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags =
    -O0
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_UART=0
debug_tool = cmsis-dap
upload_protocol = cmsis-dap
debug_speed = 500
monitor_speed = 115200
